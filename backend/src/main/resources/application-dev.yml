# DEVELOPMENT profile: Swagger UI on, SAMPLE areas seeded (DevSampleDataInitializer).
# Never activate in production.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# eSewa UAT (test) environment. EPAYTEST and this secret are the PUBLIC test credentials
# from eSewa's developer documentation - they cannot move real money. Production values
# must be supplied via ESEWA_* environment variables.
app:
  payments:
    esewa:
      enabled: ${ESEWA_ENABLED:true}
      secret-key: "${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}"

logging:
  level:
    com.example.touristpermit: DEBUG
