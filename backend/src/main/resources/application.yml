spring:
  application:
    name: tourist-permit
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tourist_permit}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:6MB}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  error:
    include-stacktrace: never
    include-message: never

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
      issuer: ${JWT_ISSUER:tourist-permit}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    login-rate-limit:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window: ${LOGIN_RATE_WINDOW:PT5M}
  storage:
    # local = disk at FILE_STORAGE_PATH (single instance); s3 = S3/MinIO bucket (multi-instance)
    type: ${STORAGE_TYPE:local}
    path: ${FILE_STORAGE_PATH:./data/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:yatrapass-uploads}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:true}
      create-bucket: ${S3_CREATE_BUCKET:true}
    allowed-mime-types: application/pdf,image/jpeg,image/png
    allowed-extensions: pdf,jpg,jpeg,png
    max-file-size: ${MAX_UPLOAD_SIZE:5MB}
    max-documents-per-application: 10
  qr:
    encryption-key: ${QR_TOKEN_ENCRYPTION_KEY}
  verification:
    location-enabled: ${VERIFICATION_LOCATION_ENABLED:false}
  permits:
    allow-overlapping: ${ALLOW_OVERLAPPING_PERMITS:false}
    expiry-cron: ${PERMIT_EXPIRY_CRON:0 5 0 * * *}
  routing:
    # OSRM-compatible routing service. The public demo server has usage limits;
    # self-host OSRM for production traffic.
    osrm-url: ${ROUTING_OSRM_URL:https://router.project-osrm.org}
    timeout: ${ROUTING_TIMEOUT:PT10S}
    cache-ttl: ${ROUTING_CACHE_TTL:PT6H}
    origin-label: ${ROUTING_ORIGIN_LABEL:Pokhara}
    origin-latitude: ${ROUTING_ORIGIN_LAT:28.2096}
    origin-longitude: ${ROUTING_ORIGIN_LNG:83.9856}
  payments:
    esewa:
      # Off by default: fees are then collected at the counter and approval does not wait for payment.
      enabled: ${ESEWA_ENABLED:false}
      product-code: ${ESEWA_PRODUCT_CODE:EPAYTEST}
      secret-key: ${ESEWA_SECRET_KEY:}
      form-url: ${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      status-url: ${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}
  notifications:
    # In-app notifications are always on. Email uses the standard SPRING_MAIL_HOST / SPRING_MAIL_PORT /
    # SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD settings.
    email:
      enabled: ${MAIL_ENABLED:false}
      from: ${MAIL_FROM:YatraPass <no-reply@yatrapass.local>}
    sms:
      # none | log (development: logs a masked number only) | sparrow (Sparrow SMS, Nepal)
      provider: ${SMS_PROVIDER:none}
      sparrow:
        url: ${SPARROW_SMS_URL:https://api.sparrowsms.com/v2/sms/}
        token: ${SPARROW_SMS_TOKEN:}
        from: ${SPARROW_SMS_FROM:}
    expiry-reminder-days: ${PERMIT_EXPIRY_REMINDER_DAYS:3,1}
    expiry-reminder-cron: ${PERMIT_EXPIRY_REMINDER_CRON:0 0 8 * * *}
    dispatch-interval: ${NOTIFICATION_DISPATCH_INTERVAL:PT15S}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    officer-email: ${SEED_OFFICER_EMAIL:}
    officer-password: ${SEED_OFFICER_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # A mail outage must not mark the application unhealthy.
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.touristpermit: INFO
