name: tourist-permit

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Bound to loopback only; remove in production if host access is not needed.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      QR_TOKEN_ENCRYPTION_KEY: ${QR_TOKEN_ENCRYPTION_KEY:?QR_TOKEN_ENCRYPTION_KEY is required}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8081}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      FILE_STORAGE_PATH: /app/data/uploads
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_OFFICER_EMAIL: ${SEED_OFFICER_EMAIL:-}
      SEED_OFFICER_PASSWORD: ${SEED_OFFICER_PASSWORD:-}
      VERIFICATION_LOCATION_ENABLED: ${VERIFICATION_LOCATION_ENABLED:-false}
      # Uploaded files: local (shared volume) or s3 (any S3-compatible store; see the "s3" profile)
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-yatrapass-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Driving routes
      ROUTING_OSRM_URL: ${ROUTING_OSRM_URL:-https://router.project-osrm.org}
      ROUTING_ORIGIN_LABEL: ${ROUTING_ORIGIN_LABEL:-Pokhara}
      ROUTING_ORIGIN_LAT: ${ROUTING_ORIGIN_LAT:-28.2096}
      ROUTING_ORIGIN_LNG: ${ROUTING_ORIGIN_LNG:-83.9856}
      # eSewa (the dev profile defaults to the public UAT test merchant). ESEWA_ENABLED and
      # ESEWA_SECRET_KEY are passed only when set, so the profile defaults apply otherwise.
      ESEWA_ENABLED:
      ESEWA_PRODUCT_CODE: ${ESEWA_PRODUCT_CODE:-EPAYTEST}
      ESEWA_SECRET_KEY:
      ESEWA_FORM_URL: ${ESEWA_FORM_URL:-https://rc-epay.esewa.com.np/api/epay/main/v2/form}
      ESEWA_STATUS_URL: ${ESEWA_STATUS_URL:-https://rc.esewa.com.np/api/epay/transaction/status/}
      # Notifications (in-app always; email/SMS optional)
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-YatraPass <no-reply@yatrapass.local>}
      SPRING_MAIL_HOST: ${MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_STARTTLS:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SPARROW_SMS_TOKEN: ${SPARROW_SMS_TOKEN:-}
      SPARROW_SMS_FROM: ${SPARROW_SMS_FROM:-}
      PERMIT_EXPIRY_REMINDER_DAYS: ${PERMIT_EXPIRY_REMINDER_DAYS:-3,1}
    volumes:
      - uploads-data:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
      # HTTPS (needed for phone cameras). Enabled only if ./certs/tls.crt and tls.key exist.
      - "${FRONTEND_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro

  # Development mail catcher: every email the app sends appears at http://localhost:8025.
  # In production point MAIL_HOST at a real SMTP relay instead.
  mailpit:
    image: axllent/mailpit:v1.27.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional S3-compatible object store for running several backend instances:
  #   docker compose --profile s3 up -d   (with STORAGE_TYPE=s3, S3_ENDPOINT=http://seaweedfs:8333)
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    profiles: ["s3"]
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data"]
    volumes:
      - seaweedfs-data:/data

volumes:
  postgres-data:
  uploads-data:
  seaweedfs-data:
